low_pass_alpha: 0.6
scaling_factor: [1.15, 1.15, 1.15, 1.15, 1.20]  # per-fingertip: [finger1, finger2, finger3, finger4, finger5(pinky)]
is_arm_based: true  # use real arm joint actuators
arm_name: realkinova  # Name of the arm (used for IK solver and URDF path)
hand_name: wuji_hand  # Name of the hand (used for floating hand retargeting reference)
collision_boxes:
  # Collision obstacles for this arm+hand setup
  - name: crossbar_mount
    center: [0.0, -0.1120, 0.0]
    half_extents: [0.762, 0.1928, 0.1016]
  - name: vertical_column
    center: [0.0, -0.039, 0.400]
    half_extents: [0.127, 0.1, 0.400]
  # Floor slab: 2m x 2m around origin, from z=-0.3 to -0.1
  - name: workspace
    center: [0.0, 0.4, -1.2]
    half_extents: [0.8, 0.8, 0.1]

ik_constraints:
  max_q_step: 10.0
  ik_max_iters: 50
  max_arm_step_norm: 0.15
  posture_weight: 0.1
  collision_repulsion_every_n: 2
  collision_interp_samples: [0.5]
  retarget_joint_lpf_alpha: 1.0
  retarget_joint_deadband: 0.001
  retarget_joint_max_step: 10.0

